# ─── Config nginx pour atlasentinel.fr ───────────────────────────────────────
# Chemin sur le serveur : /etc/nginx/sites-available/portfolio
# Puis : ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name atlasentinel.fr www.atlasentinel.fr;

    # Redirige HTTP → HTTPS (à décommenter après certbot)
    # return 301 https://$host$request_uri;

    # ── Proxy vers le serveur Bun ─────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       'upgrade';
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

